<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIGTECH - Manage Products</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    .back-btn {
      background: white;
      color: #111;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .top h1 {
      margin: 0;
    }

    .add-btn {
      background: #111;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 8px;
      background: #f1f1f1;
    }

    .product h3 {
      margin: 15px 0 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stock {
      margin-bottom: 15px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .edit {
      background: #222;
      color: white;
    }

    .delete {
      background: #e53935;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 50px;
      background: white;
      border-radius: 10px;
    }

    .low-stock {
      color: #d00;
      font-weight: bold;
    }

    .guard {
      max-width: 400px;
      margin: 100px auto;
      text-align: center;
    }

    @media (max-width: 600px) {
      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .add-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>BIGTECH Admin</h2>
  <button class="back-btn" onclick="location.href='admin.html'">
    Back to Dashboard
  </button>
</header>

<div id="guard" class="guard" style="display:none">
  <p>You need to log in as admin first.</p>
  <button class="add-btn" onclick="location.href='admin.html'">Go to login</button>
</div>

<div id="container" class="container" style="display:none">

  <div class="top">
    <h1>Manage Products</h1>

    <button class="add-btn" onclick="addProduct()">
      + Add Product
    </button>
  </div>

  <div id="products" class="products">
    <div class="empty">Loading products...</div>
  </div>

</div>

<script>

const API = "/api/products";

function getToken() {
  return localStorage.getItem("bigtechAdminToken") || "";
}

if (!getToken()) {
  document.getElementById("guard").style.display = "block";
} else {
  document.getElementById("container").style.display = "block";
  loadProducts();
}

async function loadProducts() {

  const container = document.getElementById("products");

  try {

    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("Failed to load products");
    }

    const products = await response.json();

    if (!products.length) {
      container.innerHTML = `
        <div class="empty">
          <h3>No products found</h3>
          <p>Add your first product.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = products.map(product => {

      const image = product.image || "https://via.placeholder.com/400x250?text=BIGTECH";
      const lowStock = Number(product.stock) <= 5;

      return `
        <div class="product">

          <img src="${image}" alt="${escapeHtml(product.name || "Product")}" onerror="this.src='https://via.placeholder.com/400x250?text=BIGTECH'">

          <h3>${escapeHtml(product.name || "Unnamed Product")}</h3>
          <div style="color:#777;font-size:13px;margin-bottom:6px">${escapeHtml(product.category || "Uncategorized")}</div>

          <div class="price">
            C$${Number(product.price ?? 0).toLocaleString("en-US")}
          </div>

          <div class="stock ${lowStock ? "low-stock" : ""}">
            Stock: ${product.stock ?? 0}${lowStock ? " (low)" : ""}
          </div>

          <div class="actions">

            <button class="edit"
              onclick="editProduct(${product.id})">
              Edit
            </button>

            <button class="delete"
              onclick="deleteProduct(${product.id})">
              Delete
            </button>

          </div>

        </div>
      `;

    }).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        <h3>Unable to load products</h3>
        <p>${error.message}</p>
      </div>
    `;
  }
}


function addProduct() {
  window.location.href = "add-product.html";
}


function editProduct(id) {

  window.location.href = `add-product.html?id=${id}`;
}


async function deleteProduct(id) {

  if (!confirm("Are you sure you want to delete this product?")) {
    return;
  }

  try {

    const token = getToken();

    const response = await fetch(`${API}/${id}`, {
      method: "DELETE",
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Delete failed");
    }

    alert("Product deleted successfully.");

    loadProducts();

  } catch (error) {

    alert(error.message);

  }
}


function escapeHtml(value) {

  const div = document.createElement("div");

  div.textContent = value;

  return div.innerHTML;
}


</script>

</body>
</html>
